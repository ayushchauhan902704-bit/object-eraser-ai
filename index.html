<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Eraser AI</title>
<style>
body{background:#111;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:20px}
canvas{touch-action:none}
#wrap{position:relative;display:inline-block;max-width:95vw}
#wrap img{max-width:100%;display:block}
#wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
button{padding:12px 22px;margin:8px;border:none;border-radius:8px;font-weight:bold}
.purple{background:#a855f7;color:#fff}
</style>
</head>
<body>
<h1>Magic Eraser - AI Background</h1>
<input type="file" id="file" accept="image/*">
<div id="wrap" style="display:none"><img id="img"><canvas id="canvas"></canvas></div>
<div>
<button onclick="clearMask()">Clear Brush</button>
<button class="purple" id="eraseBtn" onclick="erase()">Erase with AI</button>
</div>
<div id="resultWrap" style="display:none"><h2>Result - AI ne background banaya!</h2><img id="resultImg" style="max-width:95vw"><br><button onclick="location.reload()">New Image</button></div>
<script>
let isDrawing=false;
const imgEl=document.getElementById('img');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const fileInput=document.getElementById('file');

fileInput.onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{imgEl.src=r.result; document.getElementById('wrap').style.display='inline-block'; setTimeout(initCanvas,100)};
  r.readAsDataURL(f);
};
function initCanvas(){
  canvas.width=imgEl.clientWidth; canvas.height=imgEl.clientHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x: x*(canvas.width/rect.width), y: y*(canvas.height/rect.height)};
}
canvas.addEventListener('mousedown',e=>{isDrawing=true; draw(e)});
canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',()=>isDrawing=false);
canvas.addEventListener('touchstart',e=>{isDrawing=true; draw(e)});
canvas.addEventListener('touchmove',e=>{draw(e); e.preventDefault()},{passive:false});
canvas.addEventListener('touchend',()=>isDrawing=false);
function draw(e){
  if(!isDrawing) return;
  const p=getPos(e);
  ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(p.x,p.y,22,0,Math.PI*2); ctx.fill();
}
function clearMask(){ctx.clearRect(0,0,canvas.width,canvas.height)}
async function erase(){
  const btn=document.getElementById('eraseBtn');
  btn.textContent='AI hata raha hai... 5 sec'; btn.disabled=true;
  try{
    const mask=canvas.toDataURL('image/png');
    const res=await fetch('/api/cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imgEl.src, mask})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Backend error');
    document.getElementById('resultImg').src=data.result;
    document.getElementById('resultWrap').style.display='block';
    document.getElementById('wrap').style.display='none';
  }catch(err){
    alert('Error: '+err.message);
  }
  btn.textContent='Erase with AI'; btn.disabled=false;
}
</script>
</body>
</html>
